function formatCurrency(n) {
  return '$' + n.toLocaleString('en-US');
}

/* ==== RENDER ==== */
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function schedHTML(items,accent,tint){
  if(!items||!items.length)return'';
  var h='<div class="sched"><div class="sched-l" style="color:'+accent+';opacity:.7">The Day</div>';
  items.forEach(function(it,i){
    var tr=it.kind==='transit';
    var line=i<items.length-1?'<span class="row-line" style="background:'+accent+'22"></span>':'';
    h+='<div class="row"><div class="row-t">';
    if(!tr)h+='<div class="row-time" style="color:'+(it.key?accent:'#78716c')+';font-weight:'+(it.key?600:400)+'">'+E(it.time)+'</div>';
    h+=line+'</div><div class="row-c'+(tr?' tr':'')+'">';
    if(tr){
      h+='<div class="tr-line"><span class="tr-t">&#8595; '+E(it.title)+'</span>';
      if(it.dur)h+='<span class="tr-d">'+E(it.dur)+'</span>';
      if(it.note)h+='<span class="tr-n">'+E(it.note)+'</span>';
      h+='</div>';
    }else{
      h+='<div class="row-head"><div class="row-title" style="color:'+(it.key?'#1c1917':'#44403c')+';font-weight:'+(it.key?500:400)+'">'+E(it.title)+'</div>';
      if(it.dur)h+='<div class="row-dur" style="background:'+(it.key?tint:'transparent')+';color:'+(it.key?accent:'#a8a29e')+'">'+E(it.dur)+'</div>';
      h+='</div>';
      if(it.note)h+='<div class="row-note">'+E(it.note)+'</div>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}

function photoHTML(key,accent,tint){
  if(!key)return'';
  var keys=Array.isArray(key)?key:[key],h='';
  keys.forEach(function(k){
    var p=photos[k];if(!p)return;
    var bleed=p.contain?'':' bleed';
    h+='<figure class="ph'+bleed+'"><div class="ph-box" style="aspect-ratio:'+(p.ratio||'1.6')+';background:'+(p.contain?tint:'transparent')+'">'
      +'<img src="'+p.src+'" alt="'+E(p.caption||'')+'" loading="lazy" style="object-fit:'+(p.contain?'contain':'cover')+'"></div>';
    if(p.caption)h+='<figcaption style="color:'+accent+';opacity:.7">'+E(p.caption)+'</figcaption>';
    h+='</figure>';
  });
  return h;
}

    +'<div style="font-size:14px;color:#78716c;font-style:italic;margin-bottom:32px">Every category, every line. Cost on the right. Booking timing below.</div>';
  budgetData.categories.forEach(function(c){
    h+='<div class="cat"><div class="cat-head"><h3 class="cat-n" style="color:'+c.accent+'">'+E(c.name)+'</h3>'
      +'<div class="cat-v">'+formatCurrency(c.estimate)+'</div></div>'
      +'<div class="cat-pct">'+(c.estimate/trip.budget*100).toFixed(1)+'% of budget</div>';
    c.items.forEach(function(it){
      h+='<div class="item"><div class="item-head"><div class="item-l">'+E(it.label)+'</div>'
        +'<div class="item-c">'+formatCurrency(it.cost)+'</div></div>';
      if(it.bookBy){
        h+='<div class="item-b">'+(it.booked?'<span class="badge">&#10003; Locked</span>':'')
          +'<span class="item-when" style="color:'+(it.booked?'#166534':c.accent)+';opacity:'+(it.booked?1:.75)+'">'+E(it.bookBy)+'</span></div>';
      }
      h+='</div>';
    });
    if(c.notes)h+='<div class="notes" style="background:'+c.tint+';color:'+c.accent+'">'+E(c.notes)+'</div>';
    h+='</div>';
  });
  h+='<footer>All figures are estimates based on current research, mid-tier room categories, and average couple spend. '
    +'Hotel rates fluctuate; flight prices firm up 60 to 90 days before departure. Re-check after each booking and update the lines.</footer></section>';
  return h;
}

function kpi(label,val,sub,color,danger){
  return '<div class="kpi"><div class="kpi-v d" style="color:'+(danger?'#991b1b':'#1c1917')+'">'+val+'</div>'
    +'<div class="kpi-s" style="color:'+color+'">'+E(sub)+'</div>'
    +'<div class="kpi-l">'+E(label)+'</div></div>';
}

function show(tab){
  document.getElementById('app').innerHTML = tab==='budget'?budgetHTML():itineraryHTML();
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){show(b.dataset.tab)});
});
show('itinerary');
</script>
</body>
</html>
